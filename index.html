<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prop Challenge Control Panel</title>
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#171614;--panel:#1c1b19;--panel2:#23211f;--text:#f1ede6;--muted:#b6afa4;--accent:#63aab2;--accent2:#24383a;--good:#8ec264;--good2:#263126;--warn:#e0a66a;--warn2:#433327;--danger:#ea7b7b;--danger2:#3f2727;--radius:18px;--shadow:0 16px 32px rgba(0,0,0,.34)}
*{box-sizing:border-box} html,body{margin:0;height:100%;background:linear-gradient(180deg,#12110f,#171614);color:var(--text);font-family:'Satoshi',Arial,Helvetica,sans-serif;overflow:hidden}
body{display:flex;align-items:stretch;justify-content:center}
.container{width:100%;max-width:1600px;height:100vh;padding:12px;display:grid;grid-template-rows:auto 1fr auto auto;gap:8px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex:0 0 auto}
.brand{display:flex;gap:10px;align-items:flex-start;min-width:0}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#20363a);display:grid;place-items:center;box-shadow:var(--shadow);flex:0 0 auto}
.brand h1{margin:0;font-size:clamp(24px,2vw,34px);line-height:.96;letter-spacing:-.04em;white-space:nowrap}
.brand p{margin:5px 0 0;color:var(--muted);font-size:13px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}
.pro-card{display:block;min-height:0;margin-bottom:8px}
.panel,.bottom{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-height:0}
.card{padding:10px;display:grid;gap:7px;min-height:0}
.eyebrow{display:inline-block;background:var(--accent2);color:var(--accent);padding:6px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;width:max-content}
h2{margin:0;font-size:clamp(16px,1.2vw,20px);line-height:1.04;letter-spacing:-.04em;max-width:100%}
p{margin:0;color:var(--muted);font-size:11px;line-height:1.3}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--panel2);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:7px;min-width:0}
.stat label{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat strong{display:block;font-size:13px;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{background:var(--panel2);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:7px;display:grid;gap:5px;min-width:0}
.progresshead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:nowrap;min-width:0}
.progresshead>div:first-child{min-width:0;flex:1}
.progresshead strong{display:block;font-size:11px;line-height:1.12;white-space:normal;max-width:100%}
.meta{display:flex;gap:5px;flex-wrap:wrap;color:var(--muted);font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;line-height:1.15;max-width:48%}
.track{height:8px;background:#0f0f0e;border-radius:999px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),#7cc9d3);border-radius:999px}
.fill-success{height:100%;background:linear-gradient(90deg,var(--good),#9fdf87);border-radius:999px}
.fill-danger{height:100%;background:linear-gradient(90deg,var(--danger),#ef9999);border-radius:999px}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{padding:4px 7px;border-radius:999px;font-size:8.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--panel2);border:1px solid rgba(255,255,255,.08);color:var(--muted)}
.success{background:var(--good2);color:var(--good)}.primary{background:var(--accent2);color:var(--accent)}.warn{background:var(--warn2);color:var(--warn)}.danger{background:var(--danger2);color:var(--danger)}
.buffer-rules{background:linear-gradient(180deg,var(--danger2),transparent);border:2px solid var(--danger);border-radius:12px;padding:10px;display:grid;gap:6px;margin-top:5px}
.buffer-rules h3{margin:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--danger);font-weight:700;text-align:center}
.buffer-rules ul{margin:0;padding-left:16px;display:grid;gap:4px;color:var(--danger);font-size:11px;line-height:1.25;font-weight:600}
.buffer-rules li{color:var(--danger)}
.bottom{padding:10px;display:grid;gap:7px;min-height:0}
h3{margin:0;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;color:#ffe5a4}
.learn{font-family:Georgia,serif;font-style:italic;font-size:13px;line-height:1.28;color:#f4e7c5;background:linear-gradient(180deg,rgba(224,166,106,.18),transparent);border-left:3px solid var(--warn);padding:8px 10px;border-radius:10px}
.learn span{display:block;font-family:'Satoshi',Arial,sans-serif;font-size:8.5px;font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:3px}
.list{margin:0;padding-left:16px;display:grid;gap:4px;color:#fff9e0;font-size:11px;line-height:1.2}.debriefprompts{color:var(--muted);font-weight:700}.debriefnotes{color:var(--text)}
textarea{width:100%;min-height:70px;resize:none;border:none;outline:none;border-radius:12px;padding:9px;background:#11100f;color:var(--text);font-size:11px;line-height:1.28}
@media (max-width:1380px){.grid{grid-template-columns:1fr 1fr}.container{height:auto;min-height:100vh;overflow:auto}body{overflow:auto}}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header class="topbar">
<div class="brand">
<div class="logo"><svg viewBox="0 0 48 48" width="22" height="22" fill="none"
