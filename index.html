  &lt;style&gt;
    :root, [data-theme=&quot;light&quot;] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
    body{background:radial-gradient(circle at top right, color-mix(in oklab, var(--color-primary) 14%, transparent), transparent 30%),linear-gradient(180deg, color-mix(in oklab, var(--color-bg) 96%, black), var(--color-bg));color:var(--color-text);font-family:var(--font-body);font-size:var(--text-base);line-height:1.3}
    .container{height:100vh;max-width:1600px;margin:0 auto;padding:0.9rem;display:grid;grid-template-rows:auto 1fr;gap:0.9rem}

    .mini span{display:block;color:var(--color-text-muted);font-size:var(--text-sm);margin-top:.15rem;line-height:1.45}
    .progress-band{padding:.8rem .9rem;display:grid;gap:.55rem}
    .progress-head{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap}
    .progress-head strong{font-size:var(--text-lg);font-variant-numeric:tabular-nums lining-nums}
    .progress-meta{display:flex;gap:1rem;flex-wrap:wrap}
    .progress-track{height:12px;border-radius:999px;background:color-mix(in oklab,var(--color-surface-elev) 88%, black);overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--color-primary),color-mix(in oklab,var(--color-warning) 40%, var(--color-primary)));border-radius:999px}
    .pill-row{display:flex;flex-wrap:wrap;gap:.5rem}
    .pill{display:inline-flex;align-items:center;gap:.38rem;padding:.42rem .68rem;border-radius:999px;font-size:var(--text-xs);font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--color-surface-elev);color:var(--color-text-muted);border:1px solid color-mix(in oklab,var(--color-text) 10%, transparent)}
    .pill.success{background:var(--color-success-highlight);color:var(--color-success)}
    .pill.primary{background:var(--color-primary-highlight);color:var(--color-primary)}
    .pill.warn{background:var(--color-warning-highlight);color:var(--color-warning)}
    .pill.danger{background:var(--color-danger-highlight);color:var(--color-danger)}
    .bottom-grid{display:grid;grid-template-rows:auto auto;gap:.9rem;min-height:0}
    .bottom-box{padding:1rem;display:flex;flex-direction:column;gap:.72rem}
    .box{padding:1rem;display:flex;flex-direction:column;gap:.72rem;overflow:hidden;background:var(--color-surface-offset);border:1px solid color-mix(in oklab,var(--color-text) 9%, transparent);border-radius:var(--radius-lg)}

    .box ul,.bottom-box ul{padding-left:1.1rem;display:grid;gap:.42rem;font-size:var(--text-sm)}

    .learn{font-family:var(--font-learn);font-size:clamp(1.05rem, 1rem + .25vw, 1.2rem);font-style:italic;line-height:1.45;color:#f4e7c5;background:linear-gradient(180deg, color-mix(in oklab, var(--color-warning-highlight) 55%, transparent), transparent);border-left:4px solid var(--color-warning);padding:.85rem .95rem;border-radius:0.8rem}
    .learn span{display:block;font-family:var(--font-body);font-size:var(--text-xs);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--color-warning);margin-bottom:.35rem}
    textarea{min-height:120px;resize:none;width:100%;padding:.8rem;border-radius:var(--radius-lg);border:1px solid color-mix(in oklab,var(--color-text) 12%, transparent);background:color-mix(in oklab,var(--color-bg) 94%, black);color:var(--color-text);font-size:var(--text-sm);line-height:1.45}
    @media (max-width: 1180px){.grid{grid-template-columns:1fr}.container{height:auto;min-height:100vh}html,body{overflow:auto}}
    @media (max-width: 760px){.summary{grid-template-columns:repeat(2,1fr)}.topbar{flex-direction:column}}
    @media (max-width: 560px){.summary{grid-template-columns:1fr}.hero h2{max-width:none}}

  &lt;div class=&quot;container&quot;&gt;

      &lt;/button&gt;
    &lt;/header&gt;
    &lt;section class=&quot;grid&quot;&gt;
      &lt;article class=&quot;panel hero&quot;&gt;
        &lt;span class=&quot;eyebrow&quot;&gt;Challenge 1 · Day 1&lt;/span&gt;
        &lt;h2&gt;50K account is up $1,488 with a $51,488 balance, a $49,488 minimum balance, and 10 MNQ while working through bearish chop.&lt;/h2&gt;
        &lt;p&gt;This column mirrors the same criteria as the other challenge so you can compare both accounts at a glance while keeping the execution discipline identical.&lt;/p&gt;
        &lt;div class=&quot;summary&quot;&gt;
          &lt;div class=&quot;stat&quot;&gt;&lt;label&gt;Account balance&lt;/label&gt;&lt;strong&gt;$51,488&lt;/strong&gt;&lt;/div&gt;
          &lt;div class=&quot;stat&quot;&gt;&lt;label&gt;Minimum balance&lt;/label&gt;&lt;strong&gt;$49,488&lt;/strong&gt;&lt;/div&gt;
          &lt;div class=&quot;stat&quot;&gt;&lt;label&gt;Day 1 P&amp;amp;L&lt;/label&gt;&lt;strong&gt;+$1,488&lt;/strong&gt;&lt;/div&gt;

        &lt;/div&gt;
        &lt;div class=&quot;summary&quot;&gt;
          &lt;div class=&quot;mini&quot;&gt;&lt;strong&gt;Challenge type&lt;/strong&gt;&lt;span&gt;50K prop evaluation&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;mini&quot;&gt;&lt;strong&gt;Market posture&lt;/strong&gt;&lt;span&gt;Bearish chop&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;mini&quot;&gt;&lt;strong&gt;Floor buffer&lt;/strong&gt;&lt;span&gt;$2,000&lt;/span&gt;&lt;/div&gt;

        &lt;/div&gt;

    &lt;/section&gt;
    &lt;section class=&quot;bottom-grid&quot; style=&quot;margin-top:0.9rem;&quot;&gt;
      &lt;section class=&quot;bottom-box&quot;&gt;
        &lt;h3&gt;Key Learnings&lt;/h3&gt;
        &lt;div class=&quot;learn&quot;&gt;&lt;span&gt;Top rule to review daily&lt;/span&gt;Don't catch falling knives, wait for the structure to develop, and leverage it for scalps.&lt;/div&gt;
        &lt;ul class=&quot;key-list&quot; style=&quot;margin-top:.2rem;&quot;&gt;
          &lt;li&gt;Bearish chop is a patience test; reduce frequency and wait for clean structure instead of forcing trades.&lt;/li&gt;
          &lt;li&gt;Scalps should come from structure, not from trying to predict the bottom.&lt;/li&gt;
          &lt;li&gt;If conditions get noisy, step back and preserve the challenge.&lt;/li&gt;
          &lt;li&gt;Keep execution tight and let the market show the setup first.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/section&gt;
      &lt;section class=&quot;bottom-box&quot;&gt;
        &lt;h3&gt;Daily Debrief&lt;/h3&gt;
        &lt;ul class=&quot;debrief-prompts&quot;&gt;
          &lt;li&gt;1. Which rules were broken today?&lt;/li&gt;
          &lt;li&gt;2. Describe today's prevalent behavior.&lt;/li&gt;
          &lt;li&gt;3. What did we learn?&lt;/li&gt;
        &lt;/ul&gt;
        &lt;ul class=&quot;debrief-notes&quot;&gt;
          &lt;li&gt;Stay out of falling knife setups and wait for structure to form before taking scalps.&lt;/li&gt;
          &lt;li&gt;Both challenges are green and still have room above their floors, which keeps the pressure manageable.&lt;/li&gt;
          &lt;li&gt;The best edge is patience, not anticipation.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;textarea placeholder=&quot;Write your next debrief here...&quot;&gt;Day 1 recap: both accounts are positive, but the real win is discipline in bearish chop. No falling knives. Wait for structure, then scalp it cleanly.&lt;/textarea&gt;
